[package]
name = "leonbruno"
version = "0.1.0"
description = "A lightweight, local-first, Git-friendly API client with curl paste support"
authors = ["severalfly"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "leonbruno_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate", "charset", "http2"] }
url = "2"
